services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      # - /mnt/s/raj-storage/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/s/raj-storage/monitoring/prometheus-data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    networks:
      - raj-cloudflare_proxy_tunnel

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - /mnt/s/raj-storage/monitoring/grafana:/var/lib/grafana
    networks:
      - raj-cloudflare_proxy_tunnel

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - raj-cloudflare_proxy_tunnel

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - raj-cloudflare_proxy_tunnel

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: dcgm-exporter
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    cap_add:
      - SYS_ADMIN
    networks:
      - raj-cloudflare_proxy_tunnel

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 5s
      
      scrape_configs:
      
        - job_name: prometheus
          static_configs:
            - targets:
                - prometheus:9090
      
        - job_name: node-exporter
          static_configs:
            - targets:
                - node-exporter:9100
      
        - job_name: cadvisor
          static_configs:
            - targets:
                - cadvisor:8080
      
        - job_name: dcgm-exporter
          static_configs:
            - targets:
                - dcgm-exporter:9400

networks:
  raj-cloudflare_proxy_tunnel:
    external: true
